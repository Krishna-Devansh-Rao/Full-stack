<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <!-- Top Bar -->
        <header class="calculator-header">

            <span class="calculator-title">CALCULATOR</span>

            <button class="menu-button">⋮</button>
        </header>


        <!-- Display -->
        <section class="display">

            <div class="expression">0</div>

            <div class="result">0</div>

        </section>


        <!-- Calculator Buttons -->
        <section class="buttons">

            <!-- Top Row -->
            <button class="button utility">AC</button>
            <button class="button utility">±</button>
            <button class="button utility">%</button>
            <button class="button operator">÷</button>

            <!-- Number Row -->
            <button class="button number">7</button>
            <button class="button number">8</button>
            <button class="button number">9</button>
            <button class="button operator">×</button>

            <!-- Number Row -->
            <button class="button number">4</button>
            <button class="button number">5</button>
            <button class="button number">6</button>
            <button class="button operator">−</button>

            <!-- Number Row -->
            <button class="button number">1</button>
            <button class="button number">2</button>
            <button class="button number">3</button>
            <button class="button equals">=</button>

            <!-- Bottom Row -->
            <button class="button number zero">0</button>
            <button class="button number decimal">.</button>

        </section>

    </main>

    <script src="text.js"></script>

</body>
</html>
