<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="calculator" id="calculator">

    <!-- Top bar -->
    <div class="top-bar">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
        <!-- Sun icon -->
        <svg id="sunIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"></circle>
          <line x1="12" y1="2" x2="12" y2="4"></line>
          <line x1="12" y1="20" x2="12" y2="22"></line>
          <line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line>
          <line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line>
          <line x1="2" y1="12" x2="4" y2="12"></line>
          <line x1="20" y1="12" x2="22" y2="12"></line>
          <line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line>
          <line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line>
        </svg>
      </button>

      <button class="icon-btn dots-btn" id="menuBtn" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="12" r="1.8"></circle>
          <circle cx="12" cy="12" r="1.8"></circle>
          <circle cx="19" cy="12" r="1.8"></circle>
        </svg>
      </button>
    </div>

    <!-- Display -->
    <div class="display">
      <div class="expression" id="expression">&nbsp;</div>
      <div class="result" id="result">0</div>
    </div>

    <!-- Buttons -->
    <div class="keypad">
      <button class="btn btn-function" data-action="clear">AC</button>
      <button class="btn btn-function" data-action="sign">+/-</button>
      <button class="btn btn-function" data-action="percent">%</button>
      <button class="btn btn-operator" data-action="op" data-op="÷">÷</button>

      <button class="btn btn-number" data-num="7">7</button>
      <button class="btn btn-number" data-num="8">8</button>
      <button class="btn btn-number" data-num="9">9</button>
      <button class="btn btn-operator" data-action="op" data-op="×">×</button>

      <button class="btn btn-number" data-num="4">4</button>
      <button class="btn btn-number" data-num="5">5</button>
      <button class="btn btn-number" data-num="6">6</button>
      <button class="btn btn-operator" data-action="op" data-op="−">−</button>

      <button class="btn btn-number" data-num="1">1</button>
      <button class="btn btn-number" data-num="2">2</button>
      <button class="btn btn-number" data-num="3">3</button>
      <button class="btn btn-operator" data-action="op" data-op="+">+</button>

      <button class="btn btn-number btn-zero" data-num="0">0</button>
      <button class="btn btn-number" data-action="decimal">.</button>
      <button class="btn btn-function" data-action="backspace" aria-label="Backspace">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 4H8l-6 8 6 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
          <line x1="18" y1="9" x2="12" y2="15"></line>
          <line x1="12" y1="9" x2="18" y2="15"></line>
        </svg>
      </button>
      <button class="btn btn-equals" data-action="equals">=</button>
    </div>

  </div>

<script src="script.js"></script>
</body>
</html>
