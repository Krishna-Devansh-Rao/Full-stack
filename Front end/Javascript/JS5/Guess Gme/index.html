<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Number Guessing Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <div class="game-card">

            <div class="icon">
                🎯
            </div>

            <h1>Number Guessing</h1>

            <p class="subtitle">
                Think smart. Guess the number. Win the game.
            </p>

            <div class="divider"></div>

            <div class="info-grid">

                <div class="info-box">
                    <span class="label">GAME</span>
                    <span class="value">Guess It</span>
                </div>

                <div class="info-box">
                    <span class="label">DIFFICULTY</span>
                    <span class="value">Custom</span>
                </div>

            </div>

            <div class="instructions">

                <h2>How to Play</h2>

                <div class="instruction">
                    <span>01</span>
                    <p>Enter the maximum number.</p>
                </div>

                <div class="instruction">
                    <span>02</span>
                    <p>Guess the hidden number.</p>
                </div>

                <div class="instruction">
                    <span>03</span>
                    <p>Use the hints to find it.</p>
                </div>

                <div class="instruction">
                    <span>04</span>
                    <p>Type <strong>quit</strong> anytime to exit.</p>
                </div>

            </div>

            <button class="start-btn" onclick="startGame()">
                Start Game
                <span>→</span>
            </button>

            <div class="number-display">
    <p>Correct Number</p>
    <h2 id="correctNumber">?</h2>
</div>

            <p class="footer-text">
                Good luck &nbsp;•&nbsp; Never Give Up
            </p>

        </div>

    </main>

    <script src="text.js"></script>

</body>

</html>
