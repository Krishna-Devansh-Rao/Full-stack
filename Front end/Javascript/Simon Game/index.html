<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simon Says</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>
    <div class="background-shape shape-three"></div>
    <div class="background-shape shape-four"></div>

    <main class="game-card">

        <div class="top-section">
            <span class="game-label">MEMORY GAME</span>

            <span class="challenge">
                👑 Challenge Yourself
            </span>
        </div>


        <h1>
            Simon <span>Says</span>
        </h1>

        <p class="subtitle">
            Watch the pattern. Remember it. Repeat it.
        </p>


        <div class="status-box">
            <span class="game-icon">🎮</span>

            <h2>Press any key to start</h2>
        </div>


        <div class="btn-container">

            <div class="line-one">

                <div class="btn yellow" id="yellow">
                    <span class="number">1</span>
                    <span class="color-name">YELLOW</span>
                </div>

                <div class="btn red" id="red">
                    <span class="number">2</span>
                    <span class="color-name">RED</span>
                </div>

            </div>


            <div class="line-two">

                <div class="btn purple" id="purple">
                    <span class="number">3</span>
                    <span class="color-name">PURPLE</span>
                </div>

                <div class="btn green" id="green">
                    <span class="number">4</span>
                    <span class="color-name">GREEN</span>
                </div>

            </div>

        </div>


        <div class="motivation">
            <span>🏆</span>
            Test your memory and beat your best score!
        </div>


        <div class="footer">
            <span></span>
            FOCUS&nbsp; • &nbsp;REMEMBER&nbsp; • &nbsp;IMPROVE
            <span></span>
        </div>

    </main>


    <script src="text.js"></script>

</body>
</html>
