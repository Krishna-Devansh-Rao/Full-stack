<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📝 To-Do List</h1>

        <p class="subtitle">
            Manage your tasks using JavaScript
        </p>

        <div class="commands">

            <div class="command">
                <span>ADD</span>
                <p>Add a new task</p>
            </div>

            <div class="command">
                <span>LIST</span>
                <p>Show all your tasks</p>
            </div>

            <div class="command">
                <span>DELETE</span>
                <p>Delete a task</p>
            </div>

            <div class="command">
                <span>QUIT</span>
                <p>Exit the program</p>
            </div>

        </div>

        <button onclick="startTodo()">
            Start To-Do List
        </button>

    </div>

    <script src="text.js"></script>

</body>
</html>
